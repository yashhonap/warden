name: release

# Push a tag like v0.4.0 to build standalone downloads for Windows, macOS and Linux
# and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: check the tag matches the version
        shell: bash
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json $v"; exit 1; }
      - run: npm ci --ignore-scripts
      - run: node scripts/build-standalone.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
